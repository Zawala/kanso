name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time: a newer push cancels the older run, so the
# self-hosted Mac never has two jobs installing the toolchain at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Property tests run with a fixed seed so a CI failure reproduces locally.
  PROPTEST_RNG_SEED: "20261017"

jobs:
  # On the self-hosted Mac: several tests need macOS's fonts and text
  # system, and the Linux runner has no dbus headers for the keyring. The
  # runner keeps its target folder between runs, so no cache step.
  rust:
    # The self-hosted Mac never runs a fork's pull request: that would run a
    # stranger's code on the owner's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: scripts/ci-rust.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The app and the command-line tools build for Windows and Linux too (the
  # release workflow ships them). The tests stay on the job above: several
  # need macOS's fonts and text system.
  portability:
    name: clippy + tests (${{ matrix.os }})
    # Self-hosted, so never for a fork's pull request.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: [self-hosted, Linux, X64]
          - os: windows-x64
            runner: [self-hosted, Windows, X64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      # On the self-hosted Windows runner, plain `bash` is WSL's launcher in
      # WindowsApps, which can't run the step scripts; put Git Bash first.
      # Git for Windows may be installed for every user (Program Files) or
      # only the runner's (AppData\Local\Programs), so look where git is too.
      - name: Git Bash first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Git\bin'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Git\bin')
          )
          $gitExe = (Get-Command git -ErrorAction SilentlyContinue).Source
          if ($gitExe) { $candidates += Join-Path (Split-Path (Split-Path $gitExe)) 'bin' }
          $git = $candidates | Where-Object { Test-Path (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $git) {
            Write-Output "::error::Git for Windows' bash.exe isn't in any of: $($candidates -join ', '). The build steps need it."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $git -Encoding ascii
      - run: scripts/ci-rust.sh
        shell: bash
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --locked -- -D warnings
      # Everything but the app runs here too: the store, sync, server,
      # renderer, importer and updater, whose file, path and process code
      # differs per platform. The app's tests need macOS's text system.
      - name: Tests (all but the app)
        run: cargo test --workspace --locked --exclude kanso-app
        shell: bash

  worker:
    # The self-hosted Mac never runs a fork's pull request: that would run a
    # stranger's code on the owner's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # On a Mac: the property tests time out on the small Linux containers.
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: cloud
    env:
      # fast-check reads its seed in vitest.config.ts.
      FAST_CHECK_SEED: "20261017"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # kansoapp.app: types, tests with their coverage floor, and a production
  # build. Nothing here needs Cloudflare credentials; deploying is by hand.
  site:
    # The self-hosted Mac never runs a fork's pull request: that would run a
    # stranger's code on the owner's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: site
    env:
      # fast-check reads its seed in src/test/setup.ts.
      FAST_CHECK_SEED: "20261017"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  # The Worker under wrangler dev (Miniflare, no Cloudflare credentials) and
  # the Rust client against it: cloud/scripts/e2e-local.sh.
  # The Mac as well: it builds kanso-sync, whose Linux keyring needs dbus.
  # Jobs share that Mac, so the script takes a free port the OS picks rather
  # than a fixed KANSO_E2E_PORT.
  e2e:
    # The self-hosted Mac never runs a fork's pull request: that would run a
    # stranger's code on the owner's machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    needs: [rust, worker]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The built-in themes: the kanso-themes repository.
          submodules: true
      - run: scripts/ci-rust.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        working-directory: cloud
      - run: cloud/scripts/e2e-local.sh
