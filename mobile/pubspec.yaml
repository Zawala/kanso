name: kanso
description: Kanso for iPhone, iPad and Android.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: 3.44.8

dependencies:
  bloc: ^9.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.0
  freezed_annotation: ^3.0.0
  get_it: ^8.0.0
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  glados: ^1.1.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.0
  mocktail: ^1.0.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/icons/lucide/
    - assets/fonts/OFL-InstrumentSans.txt
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/OFL-Literata.txt
    - assets/fonts/OFL-IBMPlexMono.txt
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/InstrumentSans-Italic.ttf
          weight: 400
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-VariableItalic.ttf
          style: italic
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
        - asset: assets/fonts/SourceSerif4-VariableItalic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Variable.ttf
        - asset: assets/fonts/Literata-VariableItalic.ttf
          style: italic
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          weight: 400
          style: italic
