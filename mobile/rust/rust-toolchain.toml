# The native-assets build runs cargo in this folder, and wants the toolchain
# and the targets named here. The channel must equal the root's
# rust-toolchain.toml (CI checks it).
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
