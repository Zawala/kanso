[package]
name = "kanso-import"
description = "Imports other note apps' libraries and exports, and folders of Markdown, into Kanso's store."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
base64.workspace = true
cbc.workspace = true
chrono.workspace = true
flate2.workspace = true
kanso-core.workspace = true
kanso-store.workspace = true
pbkdf2.workspace = true
# Apple Notes writes gzipped protobuf; the structs are checked in, so no protoc.
prost.workspace = true
# Decodes `%20` and friends in Markdown link targets.
percent-encoding = "2.3"
# Evernote's .enex: streamed, so a large export never sits in memory.
quick-xml = "0.41"
# HTML imports and Apple Journal entries become Markdown.
htmd = "0.5.6"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
# Joplin's .jex is a tar; Notion's and Bear's exports are zips. The same
# versions the updater already builds.
tar = "0.4.45"
tempfile.workspace = true
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest.workspace = true
