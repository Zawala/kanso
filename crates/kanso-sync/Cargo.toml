[package]
name = "kanso-sync"
description = "Kanso's sync client: accounts with end-to-end encryption, and the sync engine that pulls remote changes, pushes local ones and moves attachment bytes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kanso-sync"
path = "src/bin/kanso-sync.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
kanso-core.workspace = true
kanso-store.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true
# Blocking HTTP with rustls: the GPUI app has no async runtime.
ureq = "3.4"
url = "2.5"

# The system's secret store for sessions, data keys, recovery keys and pending
# logouts: the Keychain on macOS, the Credential Manager on Windows, and the
# Secret Service (GNOME Keyring, KWallet) over D-Bus on Linux, with the kernel
# keyring in front of it.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
async-channel.workspace = true
# The rollback test replays the old app's store rules (tests/common/legacy.rs).
kanso-store = { workspace = true, features = ["legacy-v1-rules"] }
proptest.workspace = true
tempfile.workspace = true
