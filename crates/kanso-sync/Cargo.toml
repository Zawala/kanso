[package]
name = "kanso-sync"
description = "Kanso's Cloudflare sync client: pulls remote changes, pushes local ones and moves attachment bytes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kanso-sync"
path = "src/bin/kanso-sync.rs"

[dependencies]
anyhow.workspace = true
kanso-core.workspace = true
kanso-store.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Blocking HTTP with rustls: the GPUI app has no async runtime.
ureq = "3.4"
url = "2.5"
# macOS Keychain for the sync token.
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
async-channel.workspace = true
base64.workspace = true
proptest.workspace = true
tempfile.workspace = true
