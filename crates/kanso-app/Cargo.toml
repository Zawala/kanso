[package]
name = "kanso-app"
description = "The Kanso desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kanso"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
fastrand.workspace = true
gpui-kit.workspace = true
kanso-core.workspace = true
kanso-import.workspace = true
kanso-server.workspace = true
kanso-sync.workspace = true
kanso-store.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
base64.workspace = true
# gpui-kit's own test-support feature also resolves its alternative GPUI
# backend, whose cocoa pin conflicts; enabling it on each layer is equivalent.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.9", features = ["test-support"] }
gpui-base = { version = "=0.7.3", features = ["test-support"] }
gpui-component = { version = "=0.7.3", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
proptest.workspace = true
# Makes the library refuse a write, to test a binding that fails.
rusqlite.workspace = true
tempfile.workspace = true
# Names the item type of a test Keychain that wraps MemorySecrets.
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Real text shaping for the PNG snapshots, without the main-thread-only platform.
gpui-pre-apple = "=0.3.9"

[target.'cfg(target_os = "windows")'.dependencies]
# Gives `kanso serve` and the other commands the console they were run from:
# the release build is a GUI program without a console of its own.
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# The app icon in kanso.exe.
embed-resource = "3"
