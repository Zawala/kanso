[package]
name = "kanso-server"
description = "Kanso's local HTTP API: REST endpoints, compatible with Inkdrop's local API, and a native MCP endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64.workspace = true
# Today, in the computer's time zone, for daily notes.
chrono.workspace = true
kanso-core.workspace = true
kanso-render.workspace = true
kanso-store.workspace = true
regex-lite = "0.1"
serde.workspace = true
serde_json.workspace = true
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
proptest.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
